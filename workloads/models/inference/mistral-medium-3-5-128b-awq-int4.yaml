apiVersion: kro.run/v1alpha1
kind: VLLMEndpoint
metadata:
  name: mistral-medium-3-5-128b-awq-int4
  namespace: inference
spec:
  model: "cyankiwi/Mistral-Medium-3.5-128B-AWQ-INT4"
  gpuCount: 8
  tensorParallelSize: 8
  maxModelLen: 8192
  minVramPerGpuGiB: 13
  workerMemory: "68Gi"
  instanceType: g6.48xlarge   # pinned via --instance-type
  # maxNumSeqs: 64
  replicas: 1
  toolCallParser: mistral   # auto-detected from Mistral3ForConditionalGeneration — enables tool calling; remove for chat-only
