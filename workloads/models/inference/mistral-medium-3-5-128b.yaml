apiVersion: kro.run/v1alpha1
kind: VLLMEndpoint
metadata:
  name: mistral-medium-3-5-128b
  namespace: inference
spec:
  model: "mistralai/Mistral-Medium-3.5-128B"
  gpuCount: 4
  tensorParallelSize: 4
  maxModelLen: 8192
  minVramPerGpuGiB: 23
  workerMemory: "64Gi"
  instanceType: g6.12xlarge   # pinned via --instance-type
  # maxNumSeqs: 64
  replicas: 1
  toolCallParser: mistral   # auto-detected from Mistral3ForConditionalGeneration — enables tool calling; remove for chat-only
