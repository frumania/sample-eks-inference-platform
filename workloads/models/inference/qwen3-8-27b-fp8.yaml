apiVersion: kro.run/v1alpha1
kind: VLLMEndpoint
metadata:
  name: qwen3-8-27b-fp8
  namespace: inference
spec:
  model: "Qwen/Qwen3.8-27B-FP8"
  gpuCount: 4                 # PP(4) x TP(1) = 4 GPUs; ~7.2Gi weights/GPU leaves room for 32k KV+graphs on L4 (22Gi). PP=2 OOM'd.
  tensorParallelSize: 1
  pipelineParallelSize: 4
  maxModelLen: 32768
  minVramPerGpuGiB: 20    # L4 reports 22888Mi/GPU; keep <=22 or the affinity ((n-1)*1024)-1 makes the pod Pending
  workerMemory: "120Gi"   # 2 PP worker procs load a ~29Gi ckpt + torch.compile host spike; 30Gi OOM-killed (exit 137). Node has ~720Gi.
  instanceType: g6.48xlarge   # pinned via --instance-type
  # maxNumSeqs: 64
  replicas: 1
  toolCallParser: qwen3_xml   # set via --tool-call-parser — enables tool calling; remove for chat-only
  extraArgs:   # raw vLLM flags appended to `vllm serve`
    - "--reasoning-parser"
    - "qwen3"
    - "--kv-cache-dtype"
    - "fp8"
